services:

  postgres:
    image: postgres:15
    container_name: sport_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql

  kestra:
    image: kestra/kestra:latest
    container_name: sport_kestra
    restart: unless-stopped

    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra_db
            driverClassName: org.postgresql.Driver
            username: sport_user
            password: sport_password

        kestra:
          server:
            basic-auth:
              enabled: true
              username: admin@sport.io
              password: Admin1234

          repository:
            type: postgres

          queue:
            type: postgres

          storage:
            type: local
            local:
              basePath: /app/storage

    command: server standalone

    ports:
      - "8080:8080"

    volumes:
      - kestra_storage:/app/storage
      - ./kestra:/app/flows
      - ./scripts:/app/scripts
      - ./data:/app/data

    depends_on:
      - postgres

volumes:
  postgres_data:
  kestra_storage: