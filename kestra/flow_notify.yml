id: sport_notify_post_ingestion
namespace: sport

description: "Notification Slack déclenchée après chaque ingestion réussie"

triggers:
  - id: after_pipeline
    type: io.kestra.plugin.core.trigger.Flow
    conditions:
      - type: io.kestra.plugin.core.condition.ExecutionStatusCondition
        in:
          - SUCCESS
      - type: io.kestra.plugin.core.condition.ExecutionFlowCondition
        namespace: sport
        flowId: sport_data_pipeline

tasks:
  - id: send_slack_summary
    type: io.kestra.plugin.scripts.python.Script
    description: "Envoi du résumé Slack post-ingestion"
    script: |
      import subprocess
      subprocess.run(["python", "/app/scripts/04_notify.py"], check=True)
